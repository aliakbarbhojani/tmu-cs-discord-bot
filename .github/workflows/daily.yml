name: Daily reminders

on:
  schedule:
    - cron: "0 13 * * *"   # every day at 13:00 UTC = 8:00 a.m. Toronto time (winter)
  workflow_dispatch:        # adds a "Run workflow" button so you can test it

permissions:
  contents: write           # lets it save sent_reminders.json back to your repo

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - run: pip install -r requirements.txt

      - run: python bot.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Save sent reminders
        run: |
          if [ -f sent_reminders.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sent_reminders.json
            git diff --staged --quiet || git commit -m "Update sent reminders"
            git pull --rebase
            git push
          fi